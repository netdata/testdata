    server:
      meaning: HAProxy server name.
      presence: required
      domain:
        kind: open
      endpoint_cardinality:
        kind: bounded_configuration
      stability: stable
      evidence:
      - proxy_labels
    state:
      meaning: HAProxy check result state.
      presence: required
      domain:
        kind: closed
        values:
