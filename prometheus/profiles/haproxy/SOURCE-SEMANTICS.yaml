version: v1
profile: haproxy
upstreams:
  haproxy:
    repository: haproxy/haproxy
    commit: e134140d282c006417945d78e7964cc8fa14586a
evidence:
  process_population:
    kind: population
    upstream: haproxy
    locations:
    - src/stats.c:697-833
    - addons/promex/service-prometheus.c:425-505
    claim: Global PromEx samples describe the current HAProxy worker and values populated by stats_fill_info.
  process_lifecycle:
    kind: lifecycle
    upstream: haproxy
    locations:
    - src/stats.c:95-168
    - src/stats.c:697-833
    - addons/promex/service-prometheus.c:392-423
    claim: The process field declarations, value natures, and PromEx type overrides define current, cumulative, and constant
      values.
  process_unit:
    kind: unit
    upstream: haproxy
    locations:
    - src/stats.c:95-168
    - src/stats.c:697-833
    claim: Process field names, descriptions, and population expressions define counts, bytes, percentages, rates, durations,
      and start timestamps.
  process_labels:
    kind: label
    upstream: haproxy
    locations:
    - src/stats.c:95-168
    - addons/promex/service-prometheus.c:425-505
    claim: The build, node, and description metadata families expose one source-defined metadata label; other process families
      are unlabeled.
  percentage_display:
    kind: display_convention
    upstream: haproxy
    locations:
    - src/stats.c:95-168
    - src/stats-proxy.c:50-165
    claim: HAProxy exports percentage-valued process and server fields on a zero-to-one-hundred display scale.
  proxy_population:
    kind: population
    upstream: haproxy
    locations:
    - src/stats-proxy.c:50-165
    - addons/promex/service-prometheus.c:508-1427
    claim: Proxy statistics are emitted at frontend, listener, backend, or server scope with the corresponding configuration
      identity labels.
  proxy_lifecycle:
    kind: lifecycle
    upstream: haproxy
    locations:
    - src/stats-proxy.c:50-165
    - src/stats-proxy.c:310-1370
    claim: Proxy field natures and fill paths distinguish cumulative counters from current, limit, maximum, age, state, and
      code observations.
  proxy_unit:
    kind: unit
    upstream: haproxy
    locations:
    - src/stats-proxy.c:50-165
    - addons/promex/service-prometheus.c:508-1427
    claim: Proxy field names, descriptions, and PromEx conversions define count, byte, percentage, and second quantities.
  proxy_labels:
    kind: label
    upstream: haproxy
    locations:
    - addons/promex/service-prometheus.c:508-1427
    claim: PromEx attaches configuration identities and closed state or HTTP response-code labels to proxy-scope samples.
  proxy_state_encoding:
    kind: state_encoding
    upstream: haproxy
    locations:
    - addons/promex/service-prometheus.c:508-1427
    claim: Frontend, listener, backend, server, health-check, and agent status families emit an exact one-hot value across
      their state labels.
  http_response_partition:
    kind: relationship
    upstream: haproxy
    locations:
    - src/stats-proxy.c:88-93
    - addons/promex/service-prometheus.c:508-1427
    claim: The six response-code classes are disjoint and exhaust the source HTTP response counter array.
  aggregate_status_replacement:
    kind: relationship
    upstream: haproxy
    locations:
    - src/stats-proxy.c:157-158
    claim: The deprecated aggregate server-check-status family and aggregate server-status replacement expose the same backend
      state counts.
  resolver_population:
    kind: population
    upstream: haproxy
    locations:
    - src/resolvers.c:94-180
    - src/resolvers.c:3980-4040
    claim: Resolver module samples describe one configured nameserver within one configured resolver section.
  resolver_lifecycle:
    kind: lifecycle
    upstream: haproxy
    locations:
    - src/resolvers.c:94-180
    claim: Resolver statistics read monotonically accumulated DNS counters even though the module exports them with Prometheus
      gauge wire type.
  resolver_unit:
    kind: unit
    upstream: haproxy
    locations:
    - src/resolvers.c:94-180
    claim: Resolver values count sent queries and classified outcomes without scaling.
  resolver_labels:
    kind: label
    upstream: haproxy
    locations:
    - src/resolvers.c:94-180
    - src/resolvers.c:3980-4040
    claim: Resolver samples carry the configured resolver and nameserver identities.
  sticktable_population:
    kind: population
    upstream: haproxy
    locations:
    - src/stick_table.c:6157-6214
    claim: Stick-table module samples describe one configured stick table.
  sticktable_lifecycle:
    kind: lifecycle
    upstream: haproxy
    locations:
    - src/stick_table.c:6157-6214
    claim: Stick-table size and used-entry values are current observations.
  sticktable_unit:
    kind: unit
    upstream: haproxy
    locations:
    - src/stick_table.c:6157-6214
    claim: Stick-table values count configured capacity and currently used entries.
  sticktable_labels:
    kind: label
    upstream: haproxy
    locations:
    - src/stick_table.c:6157-6214
    claim: Stick-table samples carry the configured table name and key type.
