- id: ev_lifecycle
  kind: lifecycle
  upstream: prometheus_client_python
  locations:
  - path: prometheus_client/metrics.py
    line_start: 260
    line_end: 710
  claim: Counters and histogram components are cumulative; gauges carry current or last-set values; created companions are
