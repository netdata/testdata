- id: ev_unit
  kind: unit
  upstream: litellm
  locations:
  - path: litellm/integrations/prometheus.py
    line_start: 100
    line_end: 700
  claim: Metric names and documentation identify request, token, byte, second, currency, entity-count, and event units.
- id: ev_labels
