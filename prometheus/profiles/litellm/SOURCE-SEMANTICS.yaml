relationships:
  deployment_request_outcomes:
    kind: partition
    whole:
      signal: deployment_total_requests_total
      components:
      - value
    parts:
    - signal: deployment_success_responses_total
      components:
      - value
    - signal: deployment_failure_responses_total
      components:
      - value
    disjoint: true
    exhaustive: true
    evidence:
    - source_relationships
  guardrail_invocation_count:
    kind: sum_projection
    coarse:
      signal: guardrail_requests_total
      components:
      - value
    fine:
      signal: guardrail_latency_seconds
      components:
      - count
    group_by:
    - guardrail_name
    - hook_type
    - status
    evidence:
    - source_relationships
  internal_service_request_outcomes:
    kind: partition
    whole:
      signal: internal_service_totals
      components:
      - value
    parts:
    - signal: internal_service_latency
      components:
      - count
    - signal: internal_service_failures
      components:
      - value
    disjoint: true
    exhaustive: true
    evidence:
    - source_relationships
