version: v1
profile: litellm
upstreams:
  litellm:
    repository: BerriAI/litellm
    commit: 23de7a15d9d40006ee596e617475ba101d60c5e9
  prometheus_client_python:
    repository: prometheus/client_python
    commit: f417f6ea8f058165a1934e368fed245e91aafc14
evidence:
  source_availability:
    kind: availability
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:100-700
    - litellm/integrations/prometheus_services.py:30-151
    - litellm/proxy/middleware/in_flight_requests_middleware.py:50-90
    claim: LiteLLM registers callback, internal-service, and in-flight metrics when its Prometheus surfaces are active.
  source_population:
    kind: population
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:1170-4000
    - litellm/integrations/prometheus_services.py:186-278
    claim: Metric update paths define the events, configured entities, current values, and accounting populations entering
      each family.
  component_lifecycle:
    kind: lifecycle
    upstream: prometheus_client_python
    locations:
    - prometheus_client/metrics.py:260-710
    claim: Counters and histogram components are cumulative, Gauges are current values, and generated created companions are
      constant registration epochs.
  source_units:
    kind: unit
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:100-700
    - litellm/integrations/prometheus.py:2545-2582
    - litellm/integrations/prometheus.py:3914-3918
    claim: Metric registrations and setters define counts, currency, bytes, seconds, hours, configured per-minute limits,
      states, and Unix timestamps.
  source_labels:
    kind: label
    upstream: litellm
    locations:
    - litellm/types/integrations/prometheus.py:300-850
    claim: The metric-label registry defines LiteLLM's source label names, optionality, and closed category values.
  multiprocess_contributors:
    kind: relationship
    upstream: prometheus_client_python
    locations:
    - prometheus_client/metrics.py:410-445
    - prometheus_client/multiprocess.py:60-120
    claim: Default multiprocess Gauges expose one current point per worker PID, while single-process Gauges expose one process-local
      point.
  contributor_value_models:
    kind: relationship
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:1170-4000
    - litellm/integrations/prometheus_services.py:186-278
    claim: Distinct cumulative metric children are additive event partitions, while current Gauge children are comparable
      point values.
  source_relationships:
    kind: relationship
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:2495-2538
    - litellm/integrations/prometheus.py:2750-2775
    - litellm/integrations/prometheus.py:2815-2845
    - litellm/integrations/prometheus_services.py:186-278
    claim: Update paths establish deployment success/failure partitions, guardrail count projection, and internal-service
      success/failure totals.
  label_dependencies:
    kind: relationship
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:1170-4000
    - litellm/types/integrations/prometheus.py:300-850
    claim: Metric-child construction binds stable API-key, deployment, organization, and team identifiers to their descriptive
      metadata labels.
  created_registration:
    kind: registration
    upstream: prometheus_client_python
    locations:
    - prometheus_client/metrics.py:360-367
    - prometheus_client/metrics.py:565-572
    - prometheus_client/metrics.py:692-703
    claim: Counter and histogram children emit generated *_created registration timestamps in single-process mode.
  deprecated_sources:
    kind: deprecation
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:500-516
    claim: The legacy request counters are explicitly deprecated in favor of the proxy request counters.
  collection_hazards:
    kind: collection_hazard
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:2860-4000
    claim: Last-set file, poll, lock, and queue Gauges do not reconstruct an exact application-wide current value across workers.
  normalization_contract:
    kind: normalization
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:100-700
    - litellm/types/integrations/prometheus.py:300-850
    claim: Source metric and label grammars bound status-class derivation, reserved-label preservation, and internal-service
      category extraction.
  display_conventions:
    kind: display_convention
    upstream: litellm
    locations:
    - litellm/integrations/prometheus.py:100-700
    - litellm/integrations/prometheus.py:2545-2582
    - litellm/integrations/prometheus.py:3914-3918
    claim: Source meanings support existing operator displays for failure counts, fallbacks, hours, and configured per-minute
      limits.
environment:
  axes:
    mode:
      kind: enum
      values:
      - single
      - multiprocess
      meaning: Mutually exclusive Python Prometheus registry mode.
      evidence:
      - source_availability
  policies:
    single_mode:
      when:
        any:
        - all:
          - axis: mode
            op: eq
            value: single
      evidence:
      - source_availability
    multiprocess_mode:
      when:
        any:
        - all:
          - axis: mode
            op: eq
            value: multiprocess
      evidence:
      - source_availability
    all_modes:
      when:
        any:
        - all:
          - axis: mode
            op: in
            values:
            - single
            - multiprocess
      evidence:
      - source_availability
component_policies: {}
label_policies: {}
signals:
  active_users:
    source:
      generated:
        registry_groups:
        - callback
        scope:
          registrations:
          - litellm_active_users
    population:
      id: active_users
      meaning: 'Current or last-reported values described by: Number of billable users in LiteLLM (excludes SCIM-deactivated
        users)'
      evidence:
      - source_population
    components:
      value:
        wire_role: scalar
        lifecycle:
          kind: current
          evidence:
          - component_lifecycle
        unit:
          quantity: count
          base: one
          rate: none
          object: users
          aspect: current
          evidence:
          - source_units
    labels:
      pid:
        meaning: Python worker process identifier added by multiprocess collection.
        presence:
          when: multiprocess_mode
        domain:
          kind: open
        endpoint_cardinality:
          kind: operational_population
        stability: restart_stable
        evidence:
        - source_labels
    functional_dependencies: {}
    contributors:
      variants:
        single_process:
          identity: []
          cardinality:
            kind: singleton
          concurrency: mutually_exclusive
          value_model:
            value: comparable_point
          membership:
            stability: stable
          reset:
            scope: shared
          join:
            new_contributor_baseline: current_total
          evidence:
            population:
            - source_population
            lifecycle:
            - component_lifecycle
            relationship:
            - contributor_value_models
          when: single_mode
        multiprocess_workers:
          identity:
          - pid
          cardinality:
            kind: operational_population
          concurrency: may_coexist
          value_model:
