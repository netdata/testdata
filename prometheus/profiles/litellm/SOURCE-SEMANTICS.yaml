- id: ev_cardinality
  kind: cardinality
  upstream: litellm
  locations:
  - path: litellm/types/integrations/prometheus.py
    line_start: 300
    line_end: 850
  - path: litellm/integrations/prometheus.py
    line_start: 1170
    line_end: 4000
  claim: Configured entities are source-open unless explicitly closed; request-derived metadata and custom labels have no
    source bound.
- id: ev_availability
  kind: availability
  upstream: litellm
  locations:
  - path: litellm/integrations/prometheus.py
    line_start: 100
    line_end: 700
  claim: LiteLLM registers Prometheus instruments only when the callback and corresponding metric surface are enabled.
- id: ev_support_availability
  kind: availability
  upstream: prometheus_client_python
  locations:
  - path: prometheus_client/multiprocess.py
    line_start: 35
    line_end: 220
  claim: Default collectors are present in single-process registries and process/GC representation changes in multiprocess
    mode.
- id: ev_support_composition
  kind: relationship
  upstream: prometheus_client_python
  locations:
  - path: prometheus_client/multiprocess.py
    line_start: 35
    line_end: 220
  claim: Process-runtime and Python-GC families share the exposed registry but remain owned by their reusable support profiles.
- id: ev_normalization
  kind: normalization
  upstream: litellm
  locations:
  - path: litellm/types/integrations/prometheus.py
    line_start: 300
    line_end: 850
  - path: litellm/integrations/prometheus.py
    line_start: 100
    line_end: 700
  claim: The pinned metric and label grammars bound the profile-owned category derivations, reserved-label preservation, and
    exact exclusions.
- id: ev_created_meaning
  kind: meaning
  upstream: prometheus_client_python
  locations:
  - path: prometheus_client/metrics.py
    line_start: 260
    line_end: 710
  claim: Generated created companions encode child-registration time rather than an operational LiteLLM observation.
- id: ev_equivalence
  kind: equivalence
  upstream: litellm
  locations:
  - path: litellm/integrations/prometheus.py
    line_start: 1170
    line_end: 4000
  claim: Internal-service successful histogram counts plus failure counters own request outcomes, and guardrail invocation
    counts own the histogram-count population.
- id: ev_hazard
  kind: lifecycle
  upstream: litellm
  locations:
  - path: litellm/integrations/prometheus.py
    line_start: 1170
    line_end: 4000
  claim: The managed-file, batch-poll, pod-lock, and queue gauge paths do not expose enough update/freshness state for an
    exact lower-cardinality current view.
