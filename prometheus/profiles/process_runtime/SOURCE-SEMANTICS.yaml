version: 1
profile: process_runtime
upstreams:
  - id: prometheus_client_python
    repository: prometheus/client_python
    revision: f417f6ea8f058165a1934e368fed245e91aafc14
    version_scope: 0.24.1
    role: producer
evidence:
  - id: ev_process_availability
    kind: availability
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 16, line_end: 100}]
    claim: The default process collector is registered when enabled and emits only when the selected proc entry is readable.
  - id: ev_process_registration
    kind: registration
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 65, line_end: 93}]
    claim: The collector defines virtual memory, resident memory, start time, CPU time, open descriptors, and descriptor limit families.
  - id: ev_process_type_shape
    kind: type_shape
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 65, line_end: 93}]
    claim: CPU time is a scalar counter and the other process families are scalar gauges.
  - id: ev_process_meaning
    kind: meaning
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 65, line_end: 93}]
    claim: Family names, help text, and proc-field reads define the process resource measured by each signal.
  - id: ev_process_population
    kind: population
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 19, line_end: 30}, {path: prometheus_client/process_collector.py, line_start: 54, line_end: 63}]
    claim: Every emitted process observation describes the one process selected by the collector pid function.
  - id: ev_process_relationship
    kind: relationship
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 65, line_end: 93}]
    claim: The six process families are independent resource aspects emitted by one collector and are not additive peers.
  - id: ev_process_identity
    kind: identity
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 19, line_end: 30}, {path: prometheus_client/process_collector.py, line_start: 54, line_end: 58}]
    claim: The collector invocation selects one process and emits no subordinate identity label.
  - id: ev_process_cardinality
    kind: cardinality
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 54, line_end: 97}]
    claim: One successful collection emits at most one scalar observation for each process family.
  - id: ev_process_lifecycle
    kind: lifecycle
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 65, line_end: 93}]
    claim: CPU time is cumulative for the selected process; memory, start time, and descriptor values are current snapshots.
  - id: ev_process_unit
    kind: unit
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 65, line_end: 93}]
    claim: The implementation emits memory in bytes, CPU and start time in seconds, and descriptor counts as descriptors.
  - id: ev_start_normalization
    kind: normalization
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/process_collector.py, line_start: 69, line_end: 72}]
    claim: Process start time is emitted as an absolute Unix-epoch value rather than elapsed uptime.
  - id: ev_python_availability
    kind: availability
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 8, line_end: 24}, {path: prometheus_client/platform_collector.py, line_start: 58}]
    claim: The platform collector registers python_info in the default registry when enabled.
  - id: ev_python_registration
    kind: registration
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 15, line_end: 24}]
    claim: The platform collector defines and caches the python_info family.
  - id: ev_python_type_shape
    kind: type_shape
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 29, line_end: 35}]
    claim: python_info is a gauge-valued information family with value one and metadata labels.
  - id: ev_python_meaning
    kind: meaning
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 20, line_end: 21}, {path: prometheus_client/platform_collector.py, line_start: 37, line_end: 55}]
    claim: The family reports Python implementation and version metadata, with additional JVM metadata on Java runtimes.
  - id: ev_python_population
    kind: population
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 15, line_end: 27}]
    claim: One python_info observation describes the current Python runtime.
  - id: ev_python_relationship
    kind: relationship
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 20, line_end: 27}]
    claim: python_info is metadata and is independent of the numeric process resource families.
  - id: ev_python_lifecycle
    kind: lifecycle
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 15, line_end: 27}]
    claim: Platform metadata is captured at collector construction and remains constant for that runtime.
  - id: ev_python_unit
    kind: unit
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 29, line_end: 35}]
    claim: The information family uses the conventional unitless value one.
  - id: ev_python_labels
    kind: labels
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 29, line_end: 55}]
    claim: Mapping keys become python_info labels; CPython supplies implementation and version fields and Java adds JVM fields.
  - id: ev_python_cardinality
    kind: cardinality
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/platform_collector.py, line_start: 20, line_end: 35}]
    claim: The collector emits exactly one python_info observation for the current runtime.
availability:
  - id: process_collector_available
    proposition: The process collector is registered and its selected proc entry is readable on this platform.
    evidence: [ev_process_availability]
  - id: platform_collector_available
    proposition: The platform collector is registered in the exporter registry.
    evidence: [ev_python_availability]
