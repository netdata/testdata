        presence: required
        domain: {kind: open}
        endpoint_cardinality: {kind: singleton}
        stability: restart_stable
        evidence: [python_labels]
      version:
        meaning: Complete Python version string.
        presence: required
        domain: {kind: open}
        endpoint_cardinality: {kind: singleton}
        stability: restart_stable
        evidence: [python_labels]
      jvm_version:
