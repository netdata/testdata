        presence: {when: jvm_runtime}
        domain: {kind: open}
        endpoint_cardinality: {kind: singleton}
        stability: restart_stable
        evidence: [python_labels]
      jvm_name:
        meaning: JVM implementation name.
        presence: {when: jvm_runtime}
        domain: {kind: open}
        endpoint_cardinality: {kind: singleton}
