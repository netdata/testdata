version: v1
profile: python_gc
upstreams:
  prometheus_client_python:
    repository: prometheus/client_python
    commit: f417f6ea8f058165a1934e368fed245e91aafc14
evidence:
  gc_registration:
    kind: registration
    upstream: prometheus_client_python
    locations: [prometheus_client/gc_collector.py:17-33]
    claim: The collector registers three scalar Python garbage-collector counters.
  gc_population:
    kind: population
    upstream: prometheus_client_python
    locations: [prometheus_client/gc_collector.py:35-41]
    claim: Each observation is one cumulative statistic for one garbage-collector generation.
  gc_lifecycle:
    kind: lifecycle
    upstream: prometheus_client_python
    locations: [prometheus_client/gc_collector.py:17-39]
    claim: All three families export cumulative gc.get_stats values for each generation.
  gc_unit:
    kind: unit
    upstream: prometheus_client_python
    locations: [prometheus_client/gc_collector.py:17-39]
    claim: The source counts objects or collection events without additional scaling.
  gc_generation:
    kind: label
    upstream: prometheus_client_python
    locations: [prometheus_client/gc_collector.py:18-39]
    claim: Every family labels each observation with the enumerated gc.get_stats generation index.
