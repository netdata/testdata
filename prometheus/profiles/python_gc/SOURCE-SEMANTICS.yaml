evidence:
  - id: ev_gc_availability
    kind: availability
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 9, line_end: 15}]
    claim: The collector registers only when CPython provides gc.get_stats.
  - id: ev_gc_registration
    kind: registration
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 17, line_end: 33}]
    claim: The collector defines collected objects, uncollectable objects, and collection-count families.
  - id: ev_gc_type_shape
    kind: type_shape
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 17, line_end: 33}]
    claim: All three Python GC signals are scalar counter families partitioned by generation.
  - id: ev_gc_meaning
    kind: meaning
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 17, line_end: 41}]
    claim: Help text and gc.get_stats keys define collections, collected objects, and uncollectable objects.
  - id: ev_gc_population
    kind: population
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 35, line_end: 39}]
    claim: Each observation is the cumulative statistic for one garbage-collector generation.
  - id: ev_gc_relationship
    kind: relationship
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 35, line_end: 41}]
    claim: The three families share the generation partition but measure distinct event populations.
  - id: ev_gc_lifecycle
    kind: lifecycle
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 17, line_end: 39}]
    claim: Counter families export cumulative gc.get_stats values for each generation.
  - id: ev_gc_unit
    kind: unit
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 17, line_end: 39}]
    claim: The source counts collection events or objects without additional scaling.
  - id: ev_gc_labels
    kind: labels
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 18, line_end: 39}]
    claim: Every family carries the generation label populated from the enumerated gc.get_stats index.
  - id: ev_gc_cardinality
    kind: cardinality
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 35, line_end: 39}]
    claim: The collector emits one observation per gc.get_stats generation; the proof fixture observes generations 0, 1, and 2.
  - id: ev_gc_identity
    kind: identity
    upstream: prometheus_client_python
    locations: [{path: prometheus_client/gc_collector.py, line_start: 35, line_end: 39}]
    claim: Generation identifies the bounded comparison within the one Python runtime owned by the collector job.
availability:
  - id: gc_collector_available
    proposition: CPython provides gc.get_stats and the GC collector is registered.
    evidence: [ev_gc_availability]
