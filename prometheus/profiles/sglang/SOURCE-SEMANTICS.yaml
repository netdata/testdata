version: v1
profile: sglang
upstreams:
  sglang:
    repository: sgl-project/sglang
    commit: d91c3682b0b429e4c70df63cd57f819588ce29b0
evidence:
  http_categories:
    kind: normalization
    upstream: sglang
    locations:
    - python/sglang/srt/utils/common.py:2570-2599
    - python/sglang/srt/utils/common.py:2610-2640
    claim: HTTP method and numeric response status describe each observed request/response. Mapping methods to standard
      method names plus other and statuses to their hundred class partitions these observations without changing
      their count.
  serving_roles:
    kind: availability
    upstream: sglang
    locations:
    - python/sglang/srt/observability/metrics_collector.py:1081-1124
    - python/sglang/srt/disaggregation/encode_server.py:3658-3676
    claim: The native language runtime exposes scheduler/tokenizer or encoder instrumentation for its serving role;
      optional collectors follow enabled capabilities.
  scheduler_labels:
    kind: label
    upstream: sglang
    locations:
    - python/sglang/srt/observability/metrics_collector.py:1096-1109
    - python/sglang/srt/observability/metrics_collector.py:1131-1145
    claim: Scheduler identity comprises model, engine role, TP/PP/expert and optional DP rank. Priority queue gauges
      add total and per-priority observations; other scheduler metrics keep the default empty priority.
  tokenizer_labels:
    kind: label
    upstream: sglang
    locations:
    - python/sglang/srt/managers/tokenizer_manager.py:692-702
    - python/sglang/srt/observability/metrics_collector.py:1740-1802
    - python/sglang/srt/observability/metrics_collector.py:1822-1842
    claim: Tokenizer metrics use model and engine role. Priority and configured custom request labels can partition
      request observations. request_label is a synthetic example of a permitted configured key, not a built-in SGLang
      label.
  storage_labels:
    kind: label
    upstream: sglang
    locations:
    - python/sglang/srt/mem_cache/hiradix_cache.py:339-348
    claim: Storage observations identify the backend, TP/DP/PP/context-parallel ranks and configured parallel sizes,
      without model identity.
  cache_labels:
    kind: label
    upstream: sglang
    locations:
    - python/sglang/srt/mem_cache/base_prefix_cache.py:243-250
    - python/sglang/srt/observability/metrics_collector.py:2076-2128
    claim: Radix-cache identity uses cache_type, with pool and reason labels on the named token observations.
  encoder_labels:
    kind: label
    upstream: sglang
    locations:
    - python/sglang/srt/disaggregation/encode_server.py:3190-3213
    - python/sglang/srt/disaggregation/encode_server.py:3666-3675
    - python/sglang/srt/disaggregation/encode_server.py:3963-3970
    - python/sglang/srt/observability/metrics_collector.py:2175-2303
    claim: Encoder observations use model and DP rank, with modality, status or transfer backend on the registered
      families.
  http_labels:
    kind: label
    upstream: sglang
    locations:
    - python/sglang/srt/utils/common.py:2570-2599
    - python/sglang/srt/utils/common.py:2641-2653
    claim: HTTP observations retain method, response status and route path; unmatched requests use raw paths. Standard
      method and status classes are bounded comparisons of these raw labels.
  instrumentation_labels:
    kind: label
    upstream: sglang
    locations:
    - python/sglang/srt/observability/cpu_monitor.py:10-14
    - python/sglang/srt/observability/func_timer.py:35-41
    - python/sglang/srt/observability/startup_func_log_and_timer.py:27-32
    - python/sglang/srt/observability/metrics_collector.py:1953-1959
    claim: Instrumentation is labelled by component, function, startup context or expert layer as registered.
  counter_lifecycle:
    kind: lifecycle
    upstream: sglang
    locations:
    - python/sglang/srt/observability/metrics_collector.py:1149-1317
    - python/sglang/srt/observability/metrics_collector.py:1740-1796
    - python/sglang/srt/observability/metrics_collector.py:1920-1942
    - python/sglang/srt/observability/metrics_collector.py:2130-2157
    - python/sglang/srt/utils/common.py:2534-2544
    - python/sglang/srt/utils/common.py:2610-2640
    claim: Native counters and distribution components accumulate observations. The multiprocess registry merges
      process contributions; this contract covers a serving incarnation, without promising independent reset correction.
  gauge_lifecycle:
    kind: lifecycle
    upstream: sglang
    locations:
    - python/sglang/srt/observability/metrics_collector.py:1126-1145
    - python/sglang/srt/observability/metrics_collector.py:1318-1421
    - python/sglang/srt/observability/metrics_collector.py:1446-1477
    - python/sglang/srt/observability/metrics_collector.py:2326-2328
    - python/sglang/srt/observability/startup_func_log_and_timer.py:35-48
    claim: Gauges publish current or last-reported values; startup timers keep the maximum duration within the current
      startup incarnation.
