signals:
  encoder_dp_pending_requests:
    availability:
      any:
      - all:
        - axis: role
          op: in
          values:
          - encoder
    source:
      inline:
        registrations:
          canonical:
            family:
              exact: sglang:encoder_dp_pending_requests
            prometheus:
              type: gauge
              shape: scalar
            evidence:
            - registration_encoder_dp_pending_requests
    population:
      id: encoder_dp_pending_requests
      meaning: Number of pending requests per encoder DP rank.
      evidence:
      - gauge_population
    components:
      value:
        wire_role: scalar
        lifecycle:
          kind: current
          evidence:
          - gauge_lifecycle
        unit:
          quantity: count
          base: one
          rate: none
          object: requests
          aspect: reported
          evidence:
          - unit_encoder_dp_pending_requests
    functional_dependencies: {}
    contributors:
      variants:
        source_labels:
          identity:
          - model_name
          - dp_rank
          cardinality:
            kind: operational_population
          concurrency: may_coexist
          value_model:
            value: additive
          membership:
            stability: restart_stable
          reset:
            scope: shared
          join:
            new_contributor_baseline: zero
          evidence:
            population:
            - gauge_population
            lifecycle:
            - gauge_lifecycle
            relationship:
            - physical_encoder_cache
    label_policy: labels_encoder_dp_pending_requests
