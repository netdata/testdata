version: v1
profile: vllm
upstreams:
  vllm:
    repository: vllm-project/vllm
    commit: dc818c198d3ff50a16f38eba567da006478239c8
  prometheus_client_python:
    repository: prometheus/client_python
    commit: f417f6ea8f058165a1934e368fed245e91aafc14
  ray:
    repository: ray-project/ray
    commit: 03491225d59a1ffde99c3628969ccf456be13efd
evidence:
  source_availability:
    kind: availability
    upstream: vllm
    locations:
    - vllm/v1/metrics/loggers.py:430-1074
    - vllm/v1/metrics/perf.py:1560-1605
    - vllm/v1/spec_decode/metrics.py:204-269
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:150-239
    - vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:1128-1173
    - vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/metrics.py:101-189
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:21-150
    - vllm/entrypoints/speech_to_text/realtime/metrics.py:21-78
    - vllm/parser/metrics.py:15-108
    claim: Core, feature-specific, connector, realtime, and parser metrics are registered only when their corresponding vLLM
      components are active.
  ray_transport:
    kind: availability
    upstream: vllm
    locations:
    - vllm/v1/metrics/ray_wrappers.py:171-216
    claim: RayPrometheusStatLogger inherits the native VLLM logger and substitutes Ray-backed metric wrapper classes.
  source_population:
    kind: population
    upstream: vllm
    locations:
    - vllm/v1/metrics/loggers.py:1090-1278
    - vllm/v1/metrics/stats.py:260-500
    - vllm/v1/engine/parallel_sampling.py:128-154
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:74-148
    - vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/metrics.py:176-189
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:280-504
    - vllm/parser/metrics.py:65-108
    claim: The source update call sites define which requests, tokens, engine steps, cache events, transfers, RPCs, and parser
      invocations contribute to each metric population.
  component_lifecycle:
    kind: lifecycle
    upstream: prometheus_client_python
    locations:
    - prometheus_client/metrics.py:330-367
    - prometheus_client/metrics.py:650-703
    claim: Counters and histogram components are cumulative, gauges are current values, and created companions are registration
      epochs.
  ray_component_lifecycle:
    kind: lifecycle
    upstream: ray
    locations:
    - python/ray/_private/metrics_agent.py:389-491
    claim: Ray sum and distribution aggregation data retain cumulative counter and histogram lifecycles; last-value data retain
      current gauge lifecycle.
  source_units:
    kind: unit
    upstream: vllm
    locations:
    - vllm/v1/metrics/loggers.py:430-1074
    - vllm/v1/metrics/perf.py:1560-1605
    - vllm/v1/spec_decode/metrics.py:204-269
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:150-239
    - vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:1128-1173
    - vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/metrics.py:101-189
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:21-150
    - vllm/entrypoints/speech_to_text/realtime/metrics.py:21-78
    - vllm/parser/metrics.py:15-108
    claim: Metric names and documentation identify seconds, bytes, tokens, requests, operations, ratios, and other raw source
      units.
  source_labels:
    kind: label
    upstream: vllm
    locations:
    - vllm/v1/metrics/loggers.py:430-1074
    - vllm/v1/metrics/perf.py:1560-1605
    - vllm/v1/spec_decode/metrics.py:204-269
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:150-239
    - vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:1128-1173
    - vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/metrics.py:101-189
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:21-150
    - vllm/entrypoints/speech_to_text/realtime/metrics.py:21-78
    - vllm/parser/metrics.py:15-108
    claim: Metric registrations define model, engine, outcome, category, connector, parser, and histogram structural labels.
  ray_labels:
    kind: label
    upstream: ray
    locations:
    - src/ray/stats/tag_defs.cc:19-40
    - python/ray/_private/metrics_agent.py:497-629
    claim: Ray defines Component, Version, WorkerId, and SessionName tags; configured cardinality policy can aggregate away
      WorkerId for non-histogram metrics.
  ray_metadata_relationship:
    kind: relationship
    upstream: ray
    locations:
    - src/ray/stats/tag_defs.cc:19-40
    - python/ray/_private/metrics_agent.py:497-629
    claim: Ray worker and replica identity determine the stable component, session, and runtime-version metadata attached
      to a vLLM metric series.
  source_relationships:
    kind: relationship
    upstream: vllm
    locations:
    - vllm/v1/metrics/loggers.py:1090-1278
    - vllm/v1/metrics/stats.py:260-500
    - vllm/v1/engine/parallel_sampling.py:128-154
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:74-148
    - vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/metrics.py:176-189
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:280-504
    - vllm/parser/metrics.py:65-108
    claim: The update call sites define exact same-event relationships, source partitions, and distinct lifecycle populations
      among the declared signals.
  ray_namespace_relationship:
    kind: relationship
    upstream: ray
    locations:
    - python/ray/_private/metrics_agent.py:403-446
    claim: 'The Ray wrapper and proxy exporter preserve native vLLM metric meaning while converting the vllm: namespace to
      ray_vllm_.'
  deprecated_sources:
    kind: deprecation
    upstream: vllm
    locations:
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:132-150
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:311-379
    claim: Deprecated CPU-offload totals and transfer-size histograms are compatibility aliases emitted from the same observations
      as the canonical directional families.
  ray_compatibility_deprecation:
    kind: deprecation
    upstream: ray
    locations:
    - python/ray/_private/metrics_agent.py:403-446
    claim: The deprecated unsuffixed gauge and canonical suffixed counter are two Prometheus representations of the same Ray
      sum aggregation.
  created_registration:
    kind: registration
    upstream: prometheus_client_python
    locations:
    - prometheus_client/metrics.py:330-367
    - prometheus_client/metrics.py:650-703
    claim: Generated *_created gauges are registration epochs and not operational observations of the parent signal.
  engine_state_encoding:
    kind: state_encoding
    upstream: vllm
