    - vllm/v1/metrics/loggers.py:430-1074
    - vllm/v1/metrics/perf.py:1560-1605
    - vllm/v1/spec_decode/metrics.py:204-269
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:150-239
    - vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:1128-1173
    - vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/metrics.py:101-189
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:21-150
    - vllm/entrypoints/speech_to_text/realtime/metrics.py:21-78
    - vllm/parser/metrics.py:15-108
    claim: The engine sleep-state family represents the enumerated engine state as a one-hot labeled gauge.
  display_conventions:
    kind: display_convention
    upstream: vllm
    locations:
    - vllm/v1/metrics/loggers.py:430-1074
    - vllm/v1/metrics/perf.py:1560-1605
    - vllm/v1/spec_decode/metrics.py:204-269
    - vllm/distributed/kv_transfer/kv_connector/v1/nixl/stats.py:150-239
    - vllm/distributed/kv_transfer/kv_connector/v1/hf3fs/hf3fs_connector.py:1128-1173
    - vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/metrics.py:101-189
    - vllm/distributed/kv_transfer/kv_connector/v1/offloading/metrics.py:21-150
    - vllm/entrypoints/speech_to_text/realtime/metrics.py:21-78
    - vllm/parser/metrics.py:15-108
    claim: The registered metric meanings support the profile's exact percentage, concurrency, and per-GPU display conversions.
environment:
  axes:
    transport:
      kind: enum
      values:
      - native
      - ray
      meaning: Mutually exclusive vLLM Prometheus transport representation.
      evidence:
      - source_availability
      - ray_transport
    capabilities:
      kind: enum_set
      values:
      - speculative_decoding
      - diffusion_decoding
      - kv_residency
      - kv_offload
      - nixl
      - hf3fs
      - mooncake
      - realtime
      - tool_parser
      meaning: Optional vLLM services, decoders, and connector metric producers active on the endpoint.
      evidence:
      - source_availability
  policies:
    native_transport:
      when:
        any:
        - all:
          - axis: transport
            op: eq
            value: native
      evidence:
      - source_availability
      - ray_transport
    ray_transport:
      when:
        any:
        - all:
          - axis: transport
            op: eq
            value: ray
      evidence:
      - ray_transport
    speculative_decoding:
      when:
        any:
        - all:
          - axis: capabilities
            op: contains
            value: speculative_decoding
      evidence:
      - source_availability
    diffusion_decoding:
      when:
        any:
        - all:
          - axis: capabilities
            op: contains
            value: diffusion_decoding
      evidence:
      - source_availability
    kv_residency:
      when:
        any:
        - all:
          - axis: capabilities
            op: contains
            value: kv_residency
      evidence:
      - source_availability
    kv_offload:
      when:
        any:
        - all:
          - axis: capabilities
            op: contains
            value: kv_offload
      evidence:
      - source_availability
    nixl:
      when:
        any:
        - all:
          - axis: capabilities
            op: contains
            value: nixl
      evidence:
      - source_availability
    hf3fs:
      when:
        any:
        - all:
          - axis: capabilities
            op: contains
            value: hf3fs
      evidence:
      - source_availability
    mooncake:
      when:
        any:
        - all:
          - axis: capabilities
            op: contains
            value: mooncake
      evidence:
      - source_availability
