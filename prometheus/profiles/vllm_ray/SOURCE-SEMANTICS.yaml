availability:
- id: core_metrics_available
  proposition: The native VLLM engine logger is enabled.
  evidence:
  - ev_availability
- id: speculative_decoding_available
  proposition: Speculative decoding is enabled.
  evidence:
  - ev_availability
- id: diffusion_decoding_available
  proposition: Diffusion decoding is enabled.
  evidence:
  - ev_availability
- id: kv_residency_available
  proposition: KV cache residency metrics are enabled.
  evidence:
  - ev_availability
- id: kv_offload_available
  proposition: KV offloading or tiering metrics are enabled.
  evidence:
  - ev_availability
- id: nixl_available
  proposition: The NIXL KV connector is active.
  evidence:
  - ev_availability
- id: hf3fs_available
  proposition: The HF3FS KV connector is active.
  evidence:
  - ev_availability
- id: mooncake_available
  proposition: The Mooncake store connector is active.
  evidence:
  - ev_availability
- id: ray_transport_available
  proposition: The application configures RayPrometheusStatLogger and Ray exports its wrapped metrics.
  evidence:
  - ev_ray_transport_availability
- id: ray_compatibility_aliases_available
  proposition: Ray exports deprecated unsuffixed counter gauges because RAY_EXPORT_COUNTER_AS_GAUGE is enabled (the default).
  evidence:
  - ev_ray_transport_availability
  - ev_ray_alias_normalization
